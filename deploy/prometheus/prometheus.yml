global:
  scrape_interval: 5s

scrape_configs:
  # Service chạy trên máy host khi dev (go run / pnpm dev)
  - job_name: ingest
    static_configs: [{ targets: ["host.docker.internal:8081"] }]
  - job_name: worker
    static_configs: [{ targets: ["host.docker.internal:8082"] }]
  - job_name: api
    static_configs: [{ targets: ["host.docker.internal:3000"] }]
  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs: [{ targets: ["redpanda:9644"] }]